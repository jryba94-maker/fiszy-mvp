name: One-time verified merged branch cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-merged-branches.yml]
permissions:
  contents: write
jobs:
  cleanup:
    if: >-
      github.event.head_commit.message == 'chore: remove verified merged branches (one-time)'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Delete only audited heads already merged into main
        shell: bash
        run: |
          set -euo pipefail
          leases=()
          deletions=()
          while read -r branch expected; do
            [[ "$branch" != main && "$branch" =~ ^(codex|feat|fix|test|vercel)/[a-zA-Z0-9._/-]+$ ]]
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
            current=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
            if [[ -z "$current" ]]; then echo "Already absent: $branch"; continue; fi
            if [[ "$current" != "$expected" ]]; then echo "Preserving changed branch: $branch"; continue; fi
            git merge-base --is-ancestor "$expected" origin/main
            leases+=("--force-with-lease=refs/heads/$branch:$expected")
            deletions+=(":refs/heads/$branch")
          done <<'AUDITED_HEADS'
          codex/check-repository-status-and-finish-publish ac520acb99c801ff36759047f83d5fa418c90c88
          codex/traffic-observability 6a62db9633bd61b362e176e3cb921433df729594
          feat/admin-auction-launcher 95184d280667fa40aeb8f430976da2b0b8ed5534
          feat/auction-screen f79c144ec5841903782b2852dd6a559a313709a2
          feat/falling-price-demo 87597561c204cb5ab56e8dc49598a6b08ee01d2e
          feat/first-click-wins 48fbe8c6e517b6cb1c97eb296e76566f022a8cd1
          feat/order-history 4ff4dbaa411f285d25da1471eceab0695c272ce4
          feat/order-records 35ee7bcc3e6b262303023f408e3f9b552e2f5bea
          feat/paid-entry-access 48adfd69bc39b57130ab31b3f2809e0e1d1dee6c
          feat/server-price-demo 0a4d9e78d8eddcfa75ac9ec28c51a5210fd2b247
          feat/single-auction-session fd55aab02e1df432a1372b4aa7af0e872e2fe9cd
          feat/stripe-entry-checkout 7e0ff853dfd5884c7ec45507b311ca551c635941
          feat/winner-stripe-payment 162a32a209a4a6dac9473d52de926682dedd1dae
          fix/admin-env-diagnostics 98bec8709020e466a28c6033707914b8f6d7f1c0
          fix/admin-secret-name 6328d68dad756bccf923629c2a828468d0683cef
          test/pr-workflow 9ac02493fa6b1cc02cabbd362dd3ff5c1ffb0dd0
          test/restart-auction-1010 725b3dbf49bf2995365e8bf91016ce6cf0ab88fb
          vercel/react-server-components-cve-vu-k9sfh0 2238093531dfbe83b5e13015f92c27ce9d33b0b1
          AUDITED_HEADS
          if ((${#deletions[@]})); then
            git push --atomic "${leases[@]}" origin "${deletions[@]}"
          fi
